name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the project version, for example v4.1.0"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish Windows x64 package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate requested version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "Roche_Scoreboard/Roche_Scoreboard.csproj"
          $version = [string]$project.Project.PropertyGroup.Version | Select-Object -First 1
          $expectedTag = "v$version"
          if ("${{ inputs.tag }}" -ne $expectedTag) {
            throw "Requested tag '${{ inputs.tag }}' does not match project version '$expectedTag'."
          }

      - name: Build, validate and package
        shell: pwsh
        run: ./Build-Release.ps1 -OutputRoot "${{ runner.temp }}/roche-release"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          $package = "${{ runner.temp }}/roche-release/Roche-Scoreboard-v$version-Windows-x64.zip"
          $latestPackage = "${{ runner.temp }}/roche-release/Roche-Scoreboard-Windows-x64.zip"
          $checksum = "${{ runner.temp }}/roche-release/Roche-Scoreboard-v$version-SHA256.txt"
          Copy-Item -LiteralPath $package -Destination $latestPackage -Force

          $generated = gh api --method POST `
            "repos/${{ github.repository }}/releases/generate-notes" `
            -f "tag_name=${{ inputs.tag }}" `
            -f "target_commitish=${{ github.sha }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "GitHub release-note generation failed." }

          $intro = Get-Content -LiteralPath "packaging/GITHUB-RELEASE-INTRO.md" -Raw
          $notesPath = Join-Path "${{ runner.temp }}" "roche-release-notes.md"
          $generatedBody = [string]$generated.body
          if ([string]::IsNullOrWhiteSpace($generatedBody)) {
            $generatedBody = "No additional generated notes were available for this release."
          }
          $notes = $intro.TrimEnd() + "`n`n## What changed`n`n" + $generatedBody.Trim()
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          $arguments = @(
            "release", "create", "${{ inputs.tag }}",
            $package, $latestPackage, $checksum,
            "--target", "${{ github.sha }}",
            "--title", "Roche Scoreboard ${{ inputs.tag }}",
            "--notes-file", $notesPath
          )
          if ([System.Convert]::ToBoolean("${{ inputs.prerelease }}")) {
            $arguments += "--prerelease"
          } else {
            $arguments += "--latest"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
