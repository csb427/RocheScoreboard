 button{flex:1;padding:7px 8px}#roche-study .roche-page-heading{margin-bottom:16px}#roche-study .roche-workspace{min-height:0}#roche-study .roche-group{padding:0 13px}#roche-study .roche-dialog-actions .roche-button{flex:1}#roche-study .roche-announcement{bottom:92px}}
@media(prefers-reduced-motion:reduce){#roche-study *,#roche-study *:before{transition-duration:.01ms!important;animation-duration:.01ms!important}#roche-study .roche-button:active>.roche-surface{transform:none}}
</style>
<script>
(()=>{
 const root=document.getElementById('roche-study');
 const app=root.querySelector('.roche-app'), page=root.querySelector('[data-page]'), dock=root.querySelector('.roche-dock'), lens=root.querySelector('.roche-lens'), overlay=root.querySelector('.roche-overlay'), dialog=root.querySelector('.roche-dialog');
 const mediaReduce=matchMedia('(prefers-reduced-motion:reduce)');
 const saved=window.openai?.widgetState?.privateContent;
 const state={sport:saved?.sport==='cricket'?'cricket':'afl',tab:'match',density:'comfortable',reduced:false,contrast:false,automation:true,presentation:'Live scorebug',currentOverlay:null,paused:false,quarter:3,home:{name:'Xavier',g:19,b:12},away:{name:'Carey',g:15,b:8},runs:126,wickets:3,balls:110,extras:18,striker:0,batters:[{name:'A. Morgan',r:42,b:31},{name:'J. Taylor',r:18,b:15}],bowler:'A. Lee',bowlerRuns:24,bowlerBalls:26,history:[],undo:[]};
 state.stoppage=20;
 state.overValues=[{text:'·',legal:true},{text:'1',legal:true}];
 const config={width:1100,radius:22,history:30};
 let dialogVersion=0,dialogMotion=null,returnFocus=null,toastTimer=null,lensMotion=null;
 const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const button=(label,action,kind='',symbol='')=>`<button type="button" class="roche-button cursor-interaction ${kind}" data-action="${action}" ${label.startsWith('<i')?'aria-label="'+({'log-menu':'History actions','bowler-menu':'Bowler actions',options:'Match options'}[action]||'Actions')+'"':''}><span class="roche-surface">${symbol?icon(symbol):''}${label}</span></button>`;
 const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{'stroke-width':1.8}})};
 const reduced=()=>state.reduced||mediaReduce.matches;
 const motion=(el,frames,ms=220,opts={})=>{if(reduced()||!el.animate)return null;return el.animate(frames,{duration:ms,easing:'cubic-bezier(.22,1,.36,1)',...opts})};
 const persist=()=>{window.openai?.setWidgetState?.({modelContent:{sport:state.sport,design:'Grouped information and selective glass'},privateContent:{sport:state.sport}})?.catch(()=>{})};
 const announce=text=>{clearTimeout(toastTimer);const el=root.querySelector('.roche-announcement');el.textContent=text;motion(el,[{opacity:0,transform:'translate(-50%,6px)'},{opacity:1,transform:'translate(-50%,0)'}],180);toastTimer=setTimeout(()=>el.textContent='',2600)};
 function seedHistory(){state.history=state.sport==='afl'?[{team:'Xavier',type:'Goal',time:'12:32',colour:'#df5669'},{team:'Carey',type:'Behind',time:'12:08',colour:'#eec044'},{team:'Xavier',type:'Goal',time:'11:56',colour:'#df5669'}]:[{team:'18.2',type:'1 run',time:'Over 19',colour:'#91caff'},{team:'18.1',type:'Dot ball',time:'Over 19',colour:'#91caff'},{team:'17.5',type:'Wide',time:'Over 18',colour:'#e8c67d'}]}
 const snapshot=()=>JSON.stringify({home:state.home,away:state.away,runs:state.runs,wickets:state.wickets,balls:state.balls,extras:state.extras,striker:state.striker,batters:state.batters,bowlerRuns:state.bowlerRuns,bowlerBalls:state.bowlerBalls,overValues:state.overValues,history:state.history});
 function checkpoint(){state.undo.push(snapshot());if(state.undo.length>40)state.undo.shift()}
 function navItems(){return state.sport==='afl'?[['match','Match','circle-dot'],['output','Output','monitor'],['media','Media','play-square'],['settings','Settings','settings']]:[['match','Match','circle-dot'],['scorecard','Scorecard','list-ordered'],['output','Output','monitor'],['settings','Settings','settings']]}
 function drawDock(){dock.querySelectorAll('button').forEach(x=>x.remove());for(const [id,label,sym] of navItems())dock.insertAdjacentHTML('beforeend',`<button class="cursor-interaction" type="button" data-tab="${id}" aria-pressed="${state.tab===id}">${icon(sym)}<span>${label}</span></button>`);icons();moveLens(false)}
 function moveLens(animate=true){const selected=dock.querySelector(`[data-tab="${state.tab}"]`);if(!selected)return;const x=selected.offsetLeft,w=selected.offsetWidth;const computed=getComputedStyle(lens),fromX=computed.transform,fromW=computed.width;lensMotion?.cancel();lens.style.width=w+'px';lens.style.transform=`translateX(${x}px)`;if(animate&&!reduced())lensMotion=motion(lens,[{transform:fromX==='none'?`translateX(${x}px)`:fromX,width:fromW},{transform:`translateX(${x}px)`,width:w+'px'}],260)}
 function drawStatus(){root.querySelectorAll('[data-score],[data-run]').forEach(b=>b.disabled=state.paused);const status=root.querySelector('[data-match-state]');status.innerHTML=`<span class="roche-dot" style="background:${state.paused?'#e3bd76':'#6ed3a2'}"></span>${state.paused?'Paused':state.sport==='afl'?'Quarter running':'Innings running'}`;root.querySelector('[data-clock]').innerHTML=state.sport==='afl'?`Q${state.quarter} <span>12:34</span>`:`Malvern ${state.wickets}/${state.runs} <span>${Math.floor(state.balls/6)}.${state.balls%6} ov</span>`}
 function historyHTML(){return `<aside class="roche-log"><div class="roche-section-heading"><h3>${state.sport==='afl'?'Match log':'Delivery log'}</h3>${button(icon('ellipsis'),'log-menu','roche-circle')}</div><div class="roche-log-list">${state.history.map(historyRow).join('')}</div><div class="roche-log-note">${icon('check')}Changes stay in this study</div></aside>`}
 function historyRow(e){return `<button type="button" class="roche-log-row cursor-interaction" data-action="event" style="--team:${e.colour}"><span class="roche-event-dot"></span><span class="roche-event-copy">${esc(e.team)}<small>${esc(e.type)}</small></span><time>${esc(e.time)}</time></button>`}
 function teamHTML(key,colour,ink){const t=state[key];return `<section class="roche-team" style="--team:${colour};--team-ink:${ink}" aria-label="${t.name} scoring"><div class="roche-identity"><span class="roche-mark" aria-hidden="true">${t.name[0]}</span><strong>${t.name}</strong></div><div class="roche-team-score"><strong data-total="${key}">${t.g*6+t.b}</strong><span data-gb="${key}">${t.g}.${t.b}</span></div><button type="button" class="roche-button roche-score-button roche-goal cursor-interaction" data-score="${key}:g"><span class="roche-surface"><b>+6</b>Goal</span></button><button type="button" class="roche-button roche-score-button cursor-interaction" data-score="${key}:b"><span class="roche-surface"><b>+1</b>Behind</span></button></section>`}
 function playerHTML(i){const p=state.batters[i];return `<div class="roche-player"><span class="roche-strike" data-strike="${i}" aria-label="${i===state.striker?'On strike':'Non-striker'}">${i===state.striker?'▸':''}</span><span class="roche-player-name" data-name="${i}">${esc(p.name)}</span><span class="roche-player-figures"><span data-player-r="${i}">${p.r}</span><small>(<span data-player-b="${i}">${p.b}</span>)</small></span><button type="button" class="roche-button roche-circle cursor-interaction" aria-label="${esc(p.name)} actions" data-player-menu="${i}"><span class="roche-surface">${icon('ellipsis')}</span></button></div>`}
 function ballHTML(){const capacity=6+state.overValues.filter(x=>!x.legal).length;return Array.from({length:capacity},(_,i)=>`<span class="roche-ball ${i<state.overValues.length?'roche-filled':''}">${state.overValues[i]?.text||''}</span>`).join('')}
 function cricketHTML(){return `<div class="roche-players"><div class="roche-player-heading" style="--team:#91caff"><i></i>Malvern · Batting</div>${playerHTML(0)}${playerHTML(1)}</div><div class="roche-players"><div class="roche-player-heading" style="--team:#81cca6"><i></i>Caulfield · Bowling</div><div class="roche-player"><span class="roche-player-name">${state.bowler}</span><span class="roche-player-figures">1/<span data-bowl-r>${state.bowlerRuns}</span><small data-bowl-ov>${Math.floor(state.bowlerBalls/6)}.${state.bowlerBalls%6}</small></span>${button(icon('ellipsis'),'bowler-menu','roche-circle')}</div><div class="roche-balls" aria-label="Current over" data-balls>${ballHTML()}</div></div><div class="roche-chase" data-chase>${Math.max(0,147-state.runs)} needed from ${Math.max(0,120-state.balls)} balls</div><div class="roche-keypad">${[0,1,2,3,4,5,6,'W'].map(n=>`<button type="button" class="roche-button cursor-interaction ${n===4?'roche-four':n===6?'roche-six':n==='W'?'roche-wicket':''}" data-run="${n}"><span class="roche-surface">${n===0?'·':n}</span></button>`).join('')}</div><div class="roche-extras">${['Wide','No-ball','Bye','Leg-bye'].map(x=>button(x,'extra:'+x)).join('')}</div>`}
 function matchHTML(){return `<div class="roche-match"><section class="roche-scoring">${state.sport==='afl'?`<div class="roche-clock-tools"><span>Stoppage time<strong data-stoppage>${state.stoppage}:00</strong></span>${button('Adjust','adjust','','sliders-horizontal')}${button(icon('ellipsis'),'options','roche-circle')}</div><div class="roche-team-grid">${teamHTML('home','#b7273c','#fff')}${teamHTML('away','#ecc043','#19160b')}</div>`:cricketHTML()}<div class="roche-transport">${state.sport==='afl'?button(state.paused?'Resume quarter':'Pause quarter','pause','roche-primary',state.paused?'play':'pause'):button('Match options','options','','ellipsis')}${button('Undo','undo','','undo-2')}${button(state.sport==='afl'?'End quarter':'End innings','end','','square')}</div></section>${historyHTML()}</div>`}
 function settingsHTML(){return `<section class="roche-workspace"><div class="roche-page-heading"><div><h2>Settings</h2><p class="roche-subtitle">Operator preferences</p></div><span class="roche-quiet">This study</span></div><div class="roche-group"><div class="roche-setting"><span class="roche-setting-label">Interface density<small>Keep controls readable as space changes</small></span><div class="roche-segment" role="group" aria-label="Density">${['comfortable','compact'].map(x=>`<button type="button" data-density="${x}" aria-pressed="${state.density===x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div class="roche-setting"><span class="roche-setting-label">Reduced motion<small>Keep feedback without travelling effects</small></span><label class="roche-switch"><input type="checkbox" data-setting="reduced" aria-label="Reduced motion" ${state.reduced?'checked':''}></label></div><div class="roche-setting"><span class="roche-setting-label">Increased contrast<small>Stronger boundaries and supporting text</small></span><label class="roche-switch"><input type="checkbox" data-setting="contrast" aria-label="Increased contrast" ${state.contrast?'checked':''}></label></div></div><div class="roche-group"><div class="roche-setting"><span class="roche-setting-label">Navigation<small>Keep labels alongside symbols</small></span><span class="roche-quiet">Icons and text</span></div><div class="roche-setting"><span class="roche-setting-label">Output dimensions<small>Existing shared preference</small></span>${button('386 × 193','dimensions','','maximize')}</div></div></section>`}
 function outputHTML(){return `<section class="roche-workspace"><div class="roche-page-heading"><div><h2>Output</h2><p class="roche-subtitle">Presentation controls</p></div><span class="roche-quiet">Mock selections</span></div><div class="roche-presentation-list">${['Live scorebug',state.sport==='afl'?'Quarter breakdown':'Batting summary',state.sport==='afl'?'Match stats':'Bowling summary','Standby'].map((name,i)=>`<button type="button" class="roche-presentation cursor-interaction" data-presentation="${name}" aria-pressed="${state.presentation===name}">${icon(['monitor','list-ordered','chart-no-axes-combined','moon'][i])}<span>${name}</span><span class="roche-check">${icon('circle-check')}</span></button>`).join('')}</div><div class="roche-group"><div class="roche-setting"><span class="roche-setting-label">Automatic overlays</span><label class="roche-switch"><input type="checkbox" data-setting="automation" aria-label="Automatic overlays" ${state.automation?'checked':''}></label></div><div class="roche-overlay-tools">${(state.sport==='afl'?['Goal run','Recent scores','Weather']:['Last over','Extras','Projected score']).map(x=>button(x,'overlay:'+x)).join('')}${button('Cancel overlay','cancel-overlay','','x')}</div></div><div class="roche-output-state" data-output-state>${state.currentOverlay?'Selected overlay: '+esc(state.currentOverlay):'No overlay selected'}</div></section>`}
 function scorecardHTML(){return `<section class="roche-workspace"><div class="roche-page-heading"><div><h2>Scorecard</h2><p class="roche-subtitle">Malvern · 1st innings</p></div><strong>${state.wickets}/${state.runs}</strong></div><div class="roche-table-wrap"><table><thead><tr><th>Batter</th><th>Dismissal</th><th>R</th><th>B</th></tr></thead><tbody>${state.batters.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>Not out</td><td><button class="roche-edit-number cursor-interaction" type="button" data-edit-player="${i}" aria-label="Edit ${esc(p.name)} runs">${p.r}</button></td><td>${p.b}</td></tr>`).join('')}<tr><td>P. Smith</td><td>Caught</td><td>26</td><td>22</td></tr><tr><td>R. Jones</td><td>Bowled</td><td>14</td><td>17</td></tr><tr><td>M. Lee</td><td>LBW</td><td>8</td><td>10</td></tr><tr><td colspan="2">Extras</td><td>${state.extras}</td><td></td></tr></tbody></table></div><p class="roche-subtitle" style="margin-top:15px">Select a current batter's runs to review an edit.</p></section>`}
 function mediaHTML(){return `<section class="roche-workspace"><div class="roche-page-heading"><div><h2>Media</h2><p class="roche-subtitle">Local media selection</p></div></div><div class="roche-group"><div class="roche-setting"><span class="roche-setting-label">Video file<small>Selection stays local to this study</small></span><input class="roche-file" type="file" accept="video/*" aria-label="Choose local video" data-media></div><div class="roche-setting"><span class="roche-setting-label" data-media-label>No video selected</span>${button('Clear','clear-media','','x')}</div></div></section>`}
 function drawPage(){page.innerHTML=state.tab==='match'?matchHTML():state.tab==='settings'?settingsHTML():state.tab==='output'?outputHTML():state.tab==='scorecard'?scorecardHTML():mediaHTML();icons();applyPrefs(false);drawStatus()}
 function applyPrefs(realign=true){root.dataset.density=state.density;root.dataset.reduced=String(state.reduced);root.dataset.contrast=String(state.contrast);root.style.setProperty('--rx-radius',config.radius+'px');app.style.width=Math.min(config.width,1100)+'px';const main=root.querySelector('.roche-match');if(main)main.style.setProperty('grid-template-columns',`minmax(0,${100-config.history}fr) minmax(230px,${config.history}fr)`);if(app.getBoundingClientRect().width<762&&main)main.style.removeProperty('grid-template-columns');if(realign)moveLens(false)}
 function updateScores(){drawStatus();for(const key of ['home','away']){const total=root.querySelector(`[data-total="${key}"]`),gb=root.querySelector(`[data-gb="${key}"]`);if(total){total.textContent=state[key].g*6+state[key].b;gb.textContent=state[key].g+'.'+state[key].b}}for(let i=0;i<2;i++){const p=state.batters[i];const r=root.querySelector(`[data-player-r="${i}"]`);if(r){r.textContent=p.r;root.querySelector(`[data-player-b="${i}"]`).textContent=p.b;const marker=root.querySelector(`[data-strike="${i}"]`);marker.textContent=i===state.striker?'▸':'';marker.setAttribute('aria-label',i===state.striker?'On strike':'Non-striker')}}const bowl=root.querySelector('[data-bowl-r]');if(bowl){bowl.textContent=state.bowlerRuns;root.querySelector('[data-bowl-ov]').textContent=Math.floor(state.bowlerBalls/6)+'.'+state.bowlerBalls%6;root.querySelector('[data-balls]').innerHTML=ballHTML();root.querySelector('[data-chase]').textContent=Math.max(0,147-state.runs)+' needed from '+Math.max(0,120-state.balls)+' balls'}}
 function addEvent(e){state.history.unshift(e);if(state.history.length>30)state.history.pop();const list=root.querySelector('.roche-log-list');if(!list)return;const previous=list.scrollTop,oldHeight=list.scrollHeight;list.insertAdjacentHTML('afterbegin',historyRow(e));if(list.children.length>30)list.lastElementChild.remove();if(previous>5)list.scrollTop=previous+list.scrollHeight-oldHeight;else motion(list.firstElementChild,[{opacity:0,transform:'translateY(-5px)'},{opacity:1,transform:'translateY(0)'}],170)}
 function commitAfl(key,type){if(state.paused){announce('Resume the quarter before scoring');return}checkpoint();state[key][type]++;addEvent({team:state[key].name,type:type==='g'?'Goal':'Behind',time:'12:34',colour:key==='home'?'#df5669':'#eec044'});updateScores()}
 function commitRun(n,extra=null){if(state.paused){announce('Resume play before scoring');return}checkpoint();const batting=state.batters[state.striker],legal=!['Wide','No-ball'].includes(extra);if(state.balls%6===0)state.overValues=[];state.overValues.push({text:extra?({'Wide':'Wd','No-ball':'Nb','Bye':'B','Leg-bye':'Lb'}[extra]):n===0?'·':String(n),legal});state.runs+=n;if(extra)state.extras+=n;else batting.r+=n;if(legal){state.balls++;state.bowlerBalls++;batting.b++}if(!['Bye','Leg-bye'].includes(extra))state.bowlerRuns+=n;const notation=Math.floor((state.balls-(legal?1:0))/6)+'.'+(((state.balls-(legal?1:0))%6)+1);addEvent({team:notation,type:extra?extra+(n>1?' · '+n:''):n===0?'Dot ball':n+' run'+(n===1?'':'s'),time:'Current over',colour:'#91caff'});if(n%2===1&&extra!=='Wide'&&extra!=='No-ball')state.striker=1-state.striker;if(legal&&state.balls%6===0)state.striker=1-state.striker;updateScores()}
 function stopMotion(){dialogMotion?.cancel();dialogMotion=null}
 function openSheet(title,body,actions,source){returnFocus=source||document.activeElement;dialogVersion++;stopMotion();overlay.hidden=false;overlay.classList.remove('roche-menu-overlay');dialog.classList.remove('roche-menu');dialog.style.left='';dialog.style.top='';dialog.style.transformOrigin='center';dialog.setAttribute('aria-labelledby','roche-dialog-title');dialog.innerHTML=`<div class="roche-dialog-header"><h3 id="roche-dialog-title">${title}</h3><button type="button" class="roche-button roche-circle cursor-interaction" aria-label="Close" data-close><span class="roche-surface">${icon('x')}</span></button></div>${body}<div class="roche-dialog-actions">${actions}</div>`;icons();dialogMotion=motion(dialog,[{opacity:0,transform:'translateY(10px) scale(.975)'},{opacity:1,transform:'translateY(0) scale(1)'}],280);requestAnimationFrame(()=>(dialog.querySelector('input')||dialog.querySelector('button'))?.focus({preventScroll:true}))}
 function closeSheet(immediate=false){if(overlay.hidden)return;const version=++dialogVersion;const style=getComputedStyle(dialog),from={opacity:style.opacity,transform:style.transform};stopMotion();const finish=()=>{if(version!==dialogVersion)return;overlay.hidden=true;dialog.innerHTML='';overlay.classList.remove('roche-menu-overlay');if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true})};if(immediate||reduced()){finish();return}dialogMotion=motion(dialog,[from,{opacity:0,transform:'translateY(5px) scale(.985)'}],180);if(dialogMotion)dialogMotion.finished.then(finish).catch(()=>{});else finish()}
 function openMenu(source,items){returnFocus=source;dialogVersion++;stopMotion();overlay.hidden=false;overlay.classList.add('roche-menu-overlay');dialog.classList.add('roche-menu');dialog.removeAttribute('aria-labelledby');dialog.setAttribute('aria-label','Actions');dialog.innerHTML=items.map(([sym,label,act])=>`<button type="button" class="cursor-interaction" data-menu-action="${act}">${icon(sym)}${label}</button>`).join('');icons();const a=source.getBoundingClientRect(),b=app.getBoundingClientRect();const left=Math.min(Math.max(10,a.right-b.left-226),b.width-236);const h=items.length*46+12;const top=a.bottom-b.top+h+10>b.height?Math.max(10,a.top-b.top-h-5):a.bottom-b.top+5;dialog.style.left=Math.max(8,left)+'px';dialog.style.top=top+'px';dialog.style.transformOrigin='top right';dialogMotion=motion(dialog,[{opacity:0,transform:'scale(.96) translateY(-3px)'},{opacity:1,transform:'scale(1) translateY(0)'}],240);requestAnimationFrame(()=>dialog.querySelector('button')?.focus({preventScroll:true}))}
 function editPlayer(i,source){openSheet(state.batters[i].name,`<label>Runs<input type="number" min="0" max="999" value="${state.batters[i].r}" data-number></label><p class="roche-quiet" style="margin-top:12px">Review the innings total before applying an adjustment.</p><p class="roche-error" role="alert" data-error></p>`,button('Cancel','dismiss')+button('Apply','apply-player:'+i,'roche-primary'),source)}
 function handleAction(action,source){if(action==='dismiss'){closeSheet();return}if(action==='pause'){state.paused=!state.paused;drawStatus();const replacement=button(state.paused?'Resume quarter':'Pause quarter','pause','roche-primary',state.paused?'play':'pause');source.outerHTML=replacement;icons();root.querySelector('[data-action=pause]')?.focus({preventScroll:true});return}if(action==='undo'){if(!state.undo.length){announce('No new score to undo');return}Object.assign(state,JSON.parse(state.undo.pop()));updateScores();const list=root.querySelector('.roche-log-list');if(list)list.innerHTML=state.history.map(historyRow).join('');announce('Last entry undone');return}if(action==='adjust'){openSheet('Adjust stoppage time','<label>Minutes<input type="number" min="0" max="120" value="'+state.stoppage+'" data-number></label><p class="roche-error" role="alert" data-error></p>',button('Cancel','dismiss')+button('Apply','apply-stoppage','roche-primary'),source);return}if(action==='apply-stoppage'){const n=Number(dialog.querySelector('[data-number]').value);if(!Number.isInteger(n)||n<0||n>120){dialog.querySelector('[data-error]').textContent='Enter minutes from 0 to 120.';return}const el=root.querySelector('[data-stoppage]');state.stoppage=n;if(el)el.textContent=n+':00';closeSheet();announce('Stoppage adjustment reviewed');return}if(action==='options'){openMenu(source,[['pause',state.paused?'Resume play':'Pause play','toggle-pause'],['sliders-horizontal','Adjust match','adjust'],['rotate-ccw','Reset study','reset-study']]);return}if(action==='log-menu'){openMenu(source,[['list','Review latest entry','review-event'],['rotate-ccw','Undo latest change','undo']]);return}if(action==='bowler-menu'){openMenu(source,[['user-round','Choose bowler','choose-bowler'],['pencil','Edit figures','bowler-figures']]);return}if(action==='event'){openSheet('Review entry','<p class="roche-dialog-copy">Inspect a delivery or score event without losing your place in the log.</p>',button('Close','dismiss')+button('Undo latest entry','event-undo','roche-primary'),source);return}if(action==='event-undo'){closeSheet(true);handleAction('undo',source);return}if(action==='end'){const afl=state.sport==='afl';openSheet(afl?'End this quarter?':'End this innings?',`<p class="roche-dialog-copy">${afl?'Move to the next quarter in this design study.':'Review the innings before moving to the next stage.'}</p>`,button('Keep playing','dismiss')+button(afl?'Next quarter':'Review scorecard',afl?'next-quarter':'review-scorecard','roche-primary'),source);return}if(action==='next-quarter'){state.quarter=state.quarter===4?1:state.quarter+1;drawStatus();closeSheet();announce('Quarter advanced in the study');return}if(action==='review-scorecard'){closeSheet(true);navigate('scorecard');return}if(action.startsWith('extra:')){const type=action.slice(6);openSheet(type,`<p class="roche-dialog-copy">Choose the total extras for this example.</p><div class="roche-choices">${[1,2,3,4].map(n=>button(n+'','add-extra:'+type+':'+n)).join('')}</div>`,button('Cancel','dismiss'),source);return}if(action.startsWith('add-extra:')){const [,type,n]=action.split(':');closeSheet(true);commitRun(Number(n),type);return}if(action==='wicket'){openSheet('Record wicket',`<p class="roche-dialog-copy">${esc(state.batters[state.striker].name)} is on strike.</p><div class="roche-choices">${['Bowled','Caught','LBW','Run out'].map((x,i)=>`<button type="button" class="roche-button cursor-interaction" data-dismissal="${x}" aria-pressed="${i===0}"><span class="roche-surface">${x}</span></button>`).join('')}</div>`,button('Cancel','dismiss')+button('Confirm wicket','confirm-wicket','roche-primary'),source);return}if(action==='confirm-wicket'){if(state.wickets>=10){announce('All wickets already recorded');return}checkpoint();state.wickets++;state.balls++;state.bowlerBalls++;state.batters[state.striker].b++;addEvent({team:Math.floor(state.balls/6)+'.'+state.balls%6,type:'Wicket',time:'Current over',colour:'#e58e9c'});updateScores();closeSheet();announce('Wicket recorded in the study');return}if(action.startsWith('apply-player:')){const i=Number(action.split(':')[1]),v=Number(dialog.querySelector('[data-number]').value);if(!Number.isInteger(v)||v<0||v>999){dialog.querySelector('[data-error]').textContent='Enter runs from 0 to 999.';return}if(v===state.batters[i].r){closeSheet();return}const old=state.batters[i].r;openSheet('Review adjustment',`<p class="roche-dialog-copy">Changing ${esc(state.batters[i].name)} from ${old} to ${v} leaves the batting figures and innings total out of balance.</p><p class="roche-dialog-copy">Return to edit, or apply this example and adjust the total separately.</p>`,button('Go back','back-player:'+i)+button('Continue anyway','force-player:'+i+':'+v,'roche-primary'),returnFocus);return}if(action.startsWith('back-player:')){editPlayer(Number(action.split(':')[1]),returnFocus);return}if(action.startsWith('force-player:')){const [,i,v]=action.split(':');state.batters[Number(i)].r=Number(v);closeSheet(true);drawPage();announce('Manual edit applied to the study');return}if(action==='dimensions'){openSheet('Output preference','<p class="roche-dialog-copy">386 × 193 pixels is the existing default. This study changes no output window.</p>',button('Done','dismiss','roche-primary'),source);return}if(action.startsWith('overlay:')){state.currentOverlay=action.slice(8);root.querySelector('[data-output-state]').textContent='Selected overlay: '+state.currentOverlay;announce('Operator selection updated');return}if(action==='cancel-overlay'){state.currentOverlay=null;root.querySelector('[data-output-state]').textContent='No overlay selected';return}if(action==='clear-media'){const input=root.querySelector('[data-media]');if(input)input.value='';const label=root.querySelector('[data-media-label]');if(label)label.textContent='No video selected';return}}
 function navigate(tab){closeSheet(true);state.tab=tab;dock.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.tab===tab)));drawPage();moveLens(true);persist()}
 root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||!root.contains(el))return;if(el.dataset.sport){closeSheet(true);state.sport=el.dataset.sport;state.tab='match';state.undo=[];root.querySelectorAll('[data-sport]').forEach(x=>{if(x.tagName==='BUTTON')x.setAttribute('aria-pressed',String(x.dataset.sport===state.sport))});app.dataset.sport=state.sport;seedHistory();drawDock();drawPage();persist();return}if(el.dataset.tab){navigate(el.dataset.tab);return}if(el.hasAttribute('data-close')){closeSheet();return}if(el.dataset.score){const [team,type]=el.dataset.score.split(':');commitAfl(team,type);return}if(el.dataset.run){if(el.dataset.run==='W')handleAction('wicket',el);else commitRun(Number(el.dataset.run));return}if(el.dataset.playerMenu){const i=Number(el.dataset.playerMenu);openMenu(el,[['arrow-left-right','Swap strike','swap-strike'],['user-round','Replace batter','replace-batter:'+i],['pencil','Edit figures','edit-player:'+i]]);return}if(el.dataset.editPlayer){editPlayer(Number(el.dataset.editPlayer),el);return}if(el.dataset.density){state.density=el.dataset.density;root.querySelectorAll('[data-density]').forEach(x=>{if(x.tagName==='BUTTON')x.setAttribute('aria-pressed',String(x.dataset.density===state.density))});applyPrefs();return}if(el.dataset.presentation){state.presentation=el.dataset.presentation;root.querySelectorAll('[data-presentation]').forEach(x=>x.setAttribute('aria-pressed',String(x===el)));return}if(el.dataset.dismissal){dialog.querySelectorAll('[data-dismissal]').forEach(x=>x.setAttribute('aria-pressed',String(x===el)));return}if(el.dataset.menuAction){const a=el.dataset.menuAction;const origin=returnFocus;closeSheet(true);if(a==='swap-strike'){state.striker=1-state.striker;updateScores();announce('Strike changed');return}if(a==='toggle-pause'){state.paused=!state.paused;drawPage();return}if(a==='reset-study'){openSheet('Reset this study?','<p class="roche-dialog-copy">Only example scores and selections will reset. The actual application is not connected.</p>',button('Cancel','dismiss')+button('Reset study','confirm-reset','roche-primary'),origin);return}if(a.startsWith('edit-player:')){editPlayer(Number(a.split(':')[1]),origin);return}if(a.startsWith('replace-batter:')){const i=Number(a.split(':')[1]);openSheet('Replace batter',`<p class="roche-dialog-copy">Choose an example replacement.</p><div class="roche-choices">${['T. Wilson','S. Patel'].map(x=>button(x,'replace:'+i+':'+x)).join('')}</div>`,button('Cancel','dismiss'),origin);return}if(a==='choose-bowler'){openSheet('Choose bowler',`<div class="roche-choices">${['A. Lee','T. Evans'].map(x=>button(x,'bowler:'+x)).join('')}</div>`,button('Cancel','dismiss'),origin);return}if(a==='bowler-figures'){openSheet('Bowling figures','<p class="roche-dialog-copy">Review the current bowler alongside the delivery history.</p>',button('Done','dismiss','roche-primary'),origin);return}handleAction(a==='review-event'?'event':a,origin);return}const a=el.dataset.action;if(!a)return;if(a==='confirm-reset'){state.home={name:'Xavier',g:19,b:12};state.away={name:'Carey',g:15,b:8};state.runs=126;state.wickets=3;state.balls=110;state.extras=18;state.striker=0;state.batters=[{name:'A. Morgan',r:42,b:31},{name:'J. Taylor',r:18,b:15}];state.undo=[];state.bowlerRuns=24;state.bowlerBalls=26;state.bowler='A. Lee';state.overValues=[{text:'·',legal:true},{text:'1',legal:true}];seedHistory();closeSheet(true);drawPage();announce('Study reset');return}if(a.startsWith('replace:')){const [,i,name]=a.split(':');state.batters[Number(i)]={name,r:0,b:0};closeSheet(true);drawPage();return}if(a.startsWith('bowler:')){state.bowler=a.slice(7);closeSheet(true);drawPage();return}handleAction(a,el)});
 overlay.addEventListener('click',e=>{if(e.target===overlay){e.stopPropagation();closeSheet()}});
 root.addEventListener('change',e=>{if(e.target.dataset.setting){state[e.target.dataset.setting]=e.target.checked;applyPrefs()}if(e.target.hasAttribute('data-media'))root.querySelector('[data-media-label]').textContent=e.target.files[0]?.name||'No video selected'});
 root.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeSheet()}if(e.key==='Tab'){const all=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled)')];if(!all.length)return;const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
 let previousWidth=0,resizeFrame=0;
 const observer=new ResizeObserver(()=>{const width=app.getBoundingClientRect().width;if(Math.abs(width-previousWidth)<1)return;previousWidth=width;cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{const main=root.querySelector('.roche-match');if(main){if(width<762)main.style.removeProperty('grid-template-columns');else main.style.gridTemplateColumns=`minmax(0,${100-config.history}fr) minmax(230px,${config.history}fr)`}moveLens(false);if(!overlay.hidden&&dialog.classList.contains('roche-menu'))closeSheet(true)})});observer.observe(app);
 seedHistory();drawDock();drawPage();root.querySelectorAll('.roche-sport button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.sport===state.sport)));app.dataset.sport=state.sport;
 window.addEventListener('openai:set_globals',()=>{});
 if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:applyPrefs});tweak.addSlider(config,'width',{label:'Review width',min:320,max:1100,step:20,unit:'px'});tweak.addSlider(config,'radius',{label:'Panel curvature',min:14,max:28,step:2,unit:'px'});tweak.addSlider(config,'history',{label:'History share',min:25,max:36,step:1,unit:'%'});tweak.addToggle(state,'reduced',{label:'Reduced motion'})}
 root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
